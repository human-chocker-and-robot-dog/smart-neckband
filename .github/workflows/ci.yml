name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware
        shell: bash
        run: |
          idf.py -C firmware set-target esp32
          idf.py -C firmware build
          idf.py -C firmware size

  pc-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
