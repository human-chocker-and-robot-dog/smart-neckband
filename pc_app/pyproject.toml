[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-neckband-pc"
version = "0.1.0"
description = "PC-side tools for the AI Smart Collar V0 prototype."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
gui = [
    "bleak>=1.0",
    "neurokit2>=0.2",
    "numpy>=1.26",
    "PyOpenGL>=3.1.7",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "PySide6>=6.7",
]
serial = [
    "pyserial>=3.5",
]
ble = [
    "bleak>=1.0",
]
upload = [
    "neurokit2>=0.2",
    "numpy>=1.26",
    "pyserial>=3.5",
    "websocket-client>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
